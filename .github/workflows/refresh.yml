name: 刷新机票数据
on:
  schedule:
    - cron: "17 11 */2 * *"   # 每2天一次（美东早上6:17左右），每次约12次查询，每月约180次，在250次免费额度内
  workflow_dispatch: {}        # 也可在 Actions 页面手动点“Run workflow”
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 查询航班
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/fetch.py
      - name: 保存结果
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "更新机票数据 $(date -u +%F)"
          git push
